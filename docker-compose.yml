# ─────────────────────────────────────────────────────────────────
# Environnement de DÉVELOPPEMENT Assistant Financier.
#
#   docker compose up --build              → base + API
#   docker compose --profile client up     → base + API + front
#
# Le front (repo séparé) doit être cloné à côté de ce repo :
#   assistant-financier/
#   ├── server/   ← ce repo
#   └── client/   ← repo React + Vite
#
# Variables : voir .env (copier .env.example → .env au premier clone).
# ─────────────────────────────────────────────────────────────────
name: assistant-financier

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      target: dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: ${PORT:-5000}
      # Dans les conteneurs, l'hôte de la BD est le service "db" (pas localhost).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      CLIENT_URLS: ${CLIENT_URLS:-http://localhost:5173}
      COOKIE_SECRET: ${COOKIE_SECRET:-dev-cookie-secret-a-changer}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GROK_MODEL: ${GROK_MODEL:-llama-3.1-8b-instant}
      GROK_BASE_URL: ${GROK_BASE_URL:-https://api.groq.com/openai/v1/chat/completions}
      # Clés JWT RS256 en PEM aplati — voir .env.example pour les générer.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
      - "5555:5555" # Prisma Studio (voir README)
    volumes:
      - .:/app
      - server_node_modules:/app/node_modules
    # generate : (re)crée le client Prisma — migrate deploy : applique les
    # migrations commitées — db seed : rôles (idempotent) —
    # puis serveur en watch (hot reload).
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run dev"

  client:
    build:
      context: ../client
      target: dev
    profiles: ["client"]
    depends_on:
      - server
    environment:
      # Utilisée par le NAVIGATEUR (pas le conteneur) : localhost est correct.
      VITE_API_URL: http://localhost:${PORT:-5000}
    ports:
      - "5173:5173"
    volumes:
      - ../client:/app
      - client_node_modules:/app/node_modules
    # npm install : resynchronise le volume node_modules quand package.json a changé
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  db_data:
  server_node_modules:
  client_node_modules:
