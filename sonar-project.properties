# Analyse SonarCloud du serveur.
#
# `organization` et `projectKey` sont à ajuster après création du projet sur
# sonarcloud.io (Analyze new project → import du repo GitHub).
sonar.organization=pnzaou
sonar.projectKey=pnzaou_assistant-financier-server
sonar.projectName=Assistant Financier — Serveur

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Rapport produit par `npm run test:coverage` et récupéré en artefact par la CI.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Code généré ou non pertinent pour la dette technique :
#   generated/     → client Prisma, réécrit à chaque `prisma generate`
#   prisma/migrations/ → SQL produit par Prisma, non modifiable à la main
#   dist/          → sortie de compilation
sonar.exclusions=\
  generated/**,\
  dist/**,\
  node_modules/**,\
  prisma/migrations/**,\
  coverage/**

# Les fichiers de test sont analysés (bugs et code smells) mais exclus du
# calcul de couverture : se mesurer soi-même n'a pas de sens.
sonar.coverage.exclusions=\
  tests/**,\
  src/index.ts,\
  src/config/**,\
  src/dtos/**,\
  prisma/seed.ts
